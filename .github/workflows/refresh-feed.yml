name: Refresh StekloRoll product feed
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stekloroll-feed-refresh-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/refresh_feed.py
  refresh:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/refresh_feed.py
      - name: Commit verified feed for existing Render auto-deploy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/stekloroll.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh verified StekloRoll product feed'
          git push origin HEAD:main
